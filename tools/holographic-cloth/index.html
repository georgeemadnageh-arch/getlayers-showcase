<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holographic Cloth Generator — GetLayers Tools</title>
  <meta name="description" content="Real-time interactive 3D cloth and iridescent foil simulation studio. Drape custom graphics onto dynamic 3D surfaces." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="cloth-studio.css" />
  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="studio-body">

  <!-- Top Navigation Bar (Identical to GetLayers Header) -->
  <header class="header studio-header">
    <div class="header-container">
      
      <!-- Brand & Search -->
      <div class="header-left">
        <a href="../../index.html" class="brand" aria-label="getlayers — home">
          <svg class="logo-svg" viewBox="0 0 28 28" fill="none">
            <defs>
              <linearGradient id="brand-grad" x1="3" y1="2" x2="25" y2="26" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="50%" stop-color="#818cf8" />
                <stop offset="100%" stop-color="#c084fc" />
              </linearGradient>
            </defs>
            <path d="M14 16 24.5 21 14 26 3.5 21Z" fill="url(#brand-grad)" fill-opacity="0.3"></path>
            <path d="M14 9 24.5 14 14 19 3.5 14Z" fill="url(#brand-grad)" fill-opacity="0.6"></path>
            <path d="M14 2 24.5 7 14 12 3.5 7Z" fill="url(#brand-grad)"></path>
          </svg>
          <span class="logo-word"><span class="logo-word-dim">get</span>layers</span>
        </a>

        <div class="search-pill-nav">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" placeholder="Search..." readonly onclick="window.location.href='../../index.html'" />
          <kbd class="shortcut-badge">/</kbd>
        </div>
      </div>

      <!-- Main Navigation Menu -->
      <nav class="nav-menu">
        <a href="../../index.html#library" class="nav-link">Library</a>
        <a href="../../index.html#tools" class="nav-link active nav-link-tools">
          Tools
          <span class="new-badge">New</span>
        </a>
        <a href="../../index.html#pricing" class="nav-link">Pricing</a>
        <a href="../../index.html#docs" class="nav-link">Docs</a>
        <a href="../../index.html#affiliate" class="nav-link">Affiliate</a>
        <a href="../../index.html#contact" class="nav-link">Contact</a>
      </nav>

      <!-- External Actions -->
      <div class="header-right">
        <button type="button" class="btn-nav-action btn-mcp" onclick="window.location.href='../../index.html#mcp'">
          <span class="sparkle-symbol">✦</span>
          <span>MCP</span>
        </button>

        <button type="button" class="btn-nav-action btn-figma" onclick="window.open('https://figma.com/@getlayers', '_blank')">
          <svg class="figma-svg" width="10" height="15" viewBox="0 0 38 57" fill="none">
            <path d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Z" fill="#1ABCFE"></path>
            <path d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0Z" fill="#0ACF83"></path>
            <path d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19Z" fill="#F24E1E"></path>
            <path d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5Z" fill="#FF7262"></path>
            <path d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5Z" fill="#A259FF"></path>
          </svg>
          <span>Figma</span>
          <span class="new-badge">New</span>
        </button>

        <button type="button" class="btn-signin" onclick="window.location.href='../../index.html#signin'">
          <span class="avatar-ring">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <span>Sign in</span>
        </button>
      </div>

    </div>
  </header>

  <!-- 3-Column Studio Workspace -->
  <main class="studio-workspace">
    
    <!-- LEFT SIDEBAR: Asset Inputs & Presets -->
    <aside class="studio-sidebar studio-sidebar-left">
      
      <!-- Card: Images -->
      <div class="studio-panel">
        <div class="panel-header">
          <div class="panel-header-title">
            <svg class="panel-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Images</span>
          </div>
          <span class="panel-info-badge" title="Upload custom artwork or stickers to wrap over the 3D simulated fabric">ⓘ</span>
        </div>

        <div class="panel-body">
          <!-- Upload Slot 1: Image as cloth -->
          <label class="drop-zone" id="clothDropZone">
            <input type="file" id="clothFileInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" class="hidden" />
            <div class="drop-zone-content">
              <svg class="upload-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span class="drop-label">Image as cloth</span>
              <span class="drop-hint">PNG · JPG · WebP · SVG</span>
            </div>
          </label>

          <!-- Active Asset Slot -->
          <div class="asset-slot" id="clothAssetSlot">
            <div class="asset-thumb-preview" id="clothThumbPreview"></div>
            <div class="asset-info">
              <span class="asset-name">Cloth image</span>
              <span class="asset-meta" id="clothAssetMeta">Default Artwork · 145 KB</span>
            </div>
            <button type="button" class="btn-remove-asset" id="btnRemoveCloth" title="Remove texture">✕</button>
          </div>

          <!-- Upload Slot 2: Add image / SVG Sticker -->
          <label class="drop-zone drop-zone-secondary mt-3" id="stickerDropZone">
            <input type="file" id="stickerFileInput" accept="image/png,image/svg+xml" class="hidden" />
            <div class="drop-zone-content">
              <svg class="upload-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
              <span class="drop-label">Add image / SVG</span>
              <span class="drop-hint">A sticker on the cloth</span>
            </div>
          </label>

          <button type="button" class="btn-secondary-action mt-3" id="btnClearImages">Clear images</button>
        </div>
      </div>

      <!-- Card: Presets -->
      <div class="studio-panel mt-4">
        <div class="panel-header">
          <div class="panel-header-title">
            <svg class="panel-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Presets</span>
          </div>
        </div>

        <div class="panel-body">
          <div class="preset-tabs">
            <button class="preset-tab active" id="tabPresetAll">All</button>
            <button class="preset-tab" id="tabPresetFav">♡ Favourites</button>
          </div>

          <div class="presets-gallery mt-3" id="presetsGallery">
            <!-- Preset 1: Midnight Charcoal (Default) -->
            <button class="preset-card active" data-preset="midnightPrism">
              <div class="preset-swatch swatch-midnight"></div>
              <span class="preset-label">Midnight</span>
            </button>

            <!-- Preset 2: Aurora Iridescent Foil -->
            <button class="preset-card" data-preset="auroraFoil">
              <div class="preset-swatch swatch-aurora"></div>
              <span class="preset-label">Aurora Foil</span>
            </button>

            <!-- Preset 3: Liquid Chrome Mirror -->
            <button class="preset-card" data-preset="iceChrome">
              <div class="preset-swatch swatch-chrome"></div>
              <span class="preset-label">Liquid Chrome</span>
            </button>

            <!-- Preset 4: Velvet Noir Prism -->
            <button class="preset-card" data-preset="velvetNoir">
              <div class="preset-swatch swatch-velvet"></div>
              <span class="preset-label">Velvet Prism</span>
            </button>
          </div>
        </div>
      </div>

    </aside>

    <!-- CENTER CANVAS: 3D Interactive WebGL Viewport -->
    <section class="studio-canvas-container" id="canvasContainer">
      <div class="canvas-hint-overlay">
        <span>Click & drag to rotate · Scroll to zoom</span>
      </div>
      <canvas id="clothCanvas"></canvas>
    </section>

    <!-- RIGHT SIDEBAR: Foil Material Controls & Actions -->
    <aside class="studio-sidebar studio-sidebar-right">
      
      <!-- Locked Pro Banner -->
      <div class="banner-pro">
        <span class="banner-pro-text">Export 4K WebGL mesh & shaders</span>
        <a href="../../index.html#pricing" class="banner-pro-link">Upgrade to unlock →</a>
      </div>

      <!-- Card: Foil Settings -->
      <div class="studio-panel mt-3">
        <div class="panel-header">
          <div class="panel-header-title">
            <svg class="panel-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="6 2 18 2 22 8 12 22 2 8 6 2"></polygon>
            </svg>
            <span>Foil</span>
          </div>
          <div class="panel-header-actions">
            <span class="panel-info-badge" title="The holographic rainbow — how strong it is, how big its pattern runs, and which colours lead.">ⓘ</span>
            <button type="button" class="btn-icon-reset" id="btnResetFoil" title="Reset Foil parameters">⟲</button>
          </div>
        </div>

        <div class="panel-body controls-list">
          <!-- Parameter 1: Base colour -->
          <div class="control-row">
            <label class="control-label">Base colour</label>
            <div class="color-picker-wrap">
              <input type="color" id="inputBaseColorPicker" value="#101114" />
              <input type="text" id="inputBaseColorHex" value="#101114" spellcheck="false" />
            </div>
          </div>

          <!-- Parameter 2: Rainbow strength -->
          <div class="control-row-slider">
            <div class="slider-header">
              <label class="control-label">Rainbow strength</label>
              <span class="slider-val" id="valRainbow">0.00</span>
            </div>
            <input type="range" id="sliderRainbow" min="0" max="2" step="0.05" value="0.00" class="studio-slider" />
          </div>

          <!-- Parameter 3: Pattern size -->
          <div class="control-row-slider">
            <div class="slider-header">
              <label class="control-label">Pattern size</label>
              <span class="slider-val" id="valPattern">8</span>
            </div>
            <input type="range" id="sliderPattern" min="1" max="32" step="1" value="8" class="studio-slider" />
          </div>

          <!-- Parameter 4: Colour shift -->
          <div class="control-row-slider">
            <div class="slider-header">
              <label class="control-label">Colour shift</label>
              <span class="slider-val" id="valShift">0.00</span>
            </div>
            <input type="range" id="sliderShift" min="-1" max="1" step="0.05" value="0.00" class="studio-slider" />
          </div>

          <!-- Parameter 5: Glitter -->
          <div class="control-row-slider">
            <div class="slider-header">
              <label class="control-label">Glitter</label>
              <span class="slider-val" id="valGlitter">1.14</span>
            </div>
            <input type="range" id="sliderGlitter" min="0" max="5" step="0.05" value="1.14" class="studio-slider" />
          </div>
        </div>
      </div>

      <!-- Action & Export Controls (Bottom) -->
      <div class="studio-actions-card mt-3">
        <div class="actions-split-row">
          <button type="button" class="btn-action-split" id="btnResetPosition">
            <span>⟲ Reset position</span>
          </button>
          <button type="button" class="btn-action-split" id="btnSaveFavorite">
            <span id="favHeart">♡ Save to favourites</span>
          </button>
        </div>

        <button type="button" class="btn-action-full mt-2" id="btnCopyLink">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span>Copy link</span>
        </button>

        <button type="button" class="btn-action-primary mt-2" id="btnCopyPrompt">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>Copy prompt</span>
        </button>
      </div>

    </aside>

  </main>

  <!-- Toast Notification -->
  <div id="studioToast" class="toast hidden">Copied prompt to clipboard!</div>

  <!-- Studio Three.js Application Logic -->
  <script src="cloth-studio.js"></script>
</body>
</html>
